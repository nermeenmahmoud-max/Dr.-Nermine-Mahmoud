<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dr. Nermine Mahmoud — Portfolio</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #050d1f;
    color: #fff;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }
  #night-bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
  }
  .circles-section, .header { position: relative; z-index: 1; }
  .overlay { z-index: 200; }

  /* HEADER */
  .header {
    text-align: center;
    padding: 44px 24px 28px;
    background: linear-gradient(180deg, #050e1f 0%, transparent 100%);
  }
  .header h1 { font-size: 2.5rem; font-weight: 700; letter-spacing: 1px; }
  .header p  { margin-top: 8px; color: #7ecfa0; font-size: 1rem; letter-spacing: 2.5px; text-transform: uppercase; }
  .header-line { width: 80px; height: 3px; background: #5ec989; margin: 14px auto 0; border-radius: 2px; }

  /* CIRCLES LAYOUT */
  .circles-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
    padding: 50px 60px 80px;
  }
  .circles-row {
    display: flex;
    justify-content: center;
    gap: 80px;
  }

  .circle-btn {
    width: 155px; height: 155px;
    border-radius: 50%;
    background: linear-gradient(135deg, #5ec989 0%, #38a85e 100%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: pointer;
    border: 3px solid #7edfa8;
    box-shadow: 0 0 28px rgba(94,201,137,0.22);
    transition: transform .25s, box-shadow .25s;
    text-align: center; padding: 14px;
    position: relative;
  }
  .circle-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 0 55px rgba(94,201,137,0.5);
  }
  .circle-btn .icon  { font-size: 2rem; margin-bottom: 7px; }
  .circle-btn .label { font-size: .9rem; font-weight: 700; color: #0a1628; line-height: 1.25; }

  /* connector dots between rows */
  .connector {
    display: flex; gap: 80px; justify-content: center;
    align-items: center;
  }
  .dot-line {
    width: 2px; height: 36px;
    background: linear-gradient(to bottom, #3ab06a, transparent);
    margin: 0 auto;
  }

  /* OVERLAY */
  .overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(5,10,22,.85);
    z-index: 200;
    justify-content: center; align-items: center;
    padding: 20px;
  }
  .overlay.active { display: flex; }

  /* FULLSCREEN image viewer */
  .img-viewer {
    display: none; position: fixed; inset: 0;
    background: #000;
    z-index: 300;
    justify-content: center; align-items: center;
    flex-direction: column;
  }
  .img-viewer.active { display: flex; }
  .img-viewer img {
    max-width: 100vw; max-height: 92vh;
    object-fit: contain;
  }
  .img-viewer-close {
    position: absolute; top: 16px; right: 20px;
    background: #1d3a6e; border: none; border-radius: 50%;
    width: 40px; height: 40px; font-size: 1.3rem;
    color: #5ec989; cursor: pointer; display: flex;
    align-items: center; justify-content: center;
  }

  .img-counter {
    position: absolute; top: 20px; left: 50%;
    transform: translateX(-50%);
    color: #7ecfa0; font-size: .9rem;
    background: rgba(10,22,40,.7);
    padding: 4px 14px; border-radius: 20px;
  }

  /* MODAL */
  .modal {
    background: #0f2044;
    border: 1.5px solid #3ab06a;
    border-radius: 20px;
    max-width: 860px; width: 100%;
    max-height: 88vh; overflow-y: auto;
    padding: 36px 40px;
    position: relative;
    box-shadow: 0 0 60px rgba(94,201,137,.18);
  }
  .modal::-webkit-scrollbar { width: 6px; }
  .modal::-webkit-scrollbar-thumb { background: #3ab06a; border-radius: 3px; }
  .modal-close {
    position: sticky; top: 0; float: right;
    height: 36px; padding: 0 18px;
    background: #1d3a6e; border: 1.5px solid #3ab06a; border-radius: 20px;
    color: #5ec989; font-size: .88rem; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background .2s; z-index: 10; letter-spacing: .5px;
  }
  .modal-close:hover { background: #3ab06a; color: #0a1628; }
  .modal h2 {
    font-size: 1.7rem; color: #5ec989;
    margin-bottom: 24px;
    border-bottom: 1.5px solid #1d3a6e;
    padding-bottom: 12px;
  }

  /* content helpers */
  .stat-row { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 24px; }
  .stat-card {
    background: #152d56; border-left: 4px solid #5ec989;
    border-radius: 10px; padding: 16px 22px;
    flex: 1; min-width: 130px;
  }
  .stat-card .num { font-size: 2rem; font-weight: 800; color: #5ec989; }
  .stat-card .desc { font-size: .82rem; color: #a8c8f0; margin-top: 4px; }

  .tag-list { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0; }
  .tag {
    background: #152d56; border: 1px solid #3ab06a;
    border-radius: 20px; padding: 6px 16px;
    font-size: .83rem; color: #7ecfa0;
  }
  .section-title {
    font-size: 1rem; color: #7ecfa0; font-weight: 600;
    margin: 20px 0 10px; text-transform: uppercase; letter-spacing: 1px;
  }
  p.body-text { color: #c8dff8; line-height: 1.7; margin-bottom: 12px; font-size: .93rem; }

  /* project images — clickable thumbnails */
  .proj-img-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px; margin-top: 14px;
  }
  .proj-img-grid img {
    width: 100%; border-radius: 10px;
    border: 2px solid #1d3a6e;
    object-fit: cover; cursor: zoom-in;
    transition: border-color .2s, transform .2s;
    aspect-ratio: 16/10;
  }
  .proj-img-grid img:hover {
    border-color: #5ec989; transform: scale(1.02);
  }

  .project-tab-row { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .project-tab {
    padding: 8px 20px; border-radius: 20px;
    border: 1.5px solid #3ab06a;
    background: transparent; color: #7ecfa0;
    cursor: pointer; font-size: .88rem; transition: all .2s;
  }
  .project-tab.active, .project-tab:hover {
    background: #3ab06a; color: #0a1628; font-weight: 700;
  }
  .project-panel { display: none; }
  .project-panel.active { display: block; }

  .fund-card {
    background: #152d56; border-radius: 12px;
    padding: 20px 24px; margin-bottom: 16px;
    border-left: 4px solid #5ec989;
  }
  .fund-card h3 { color: #5ec989; margin-bottom: 10px; }
  .fund-card ul { list-style: none; }
  .fund-card ul li {
    padding: 7px 0; border-bottom: 1px solid #1d3a6e;
    font-size: .88rem; color: #c8dff8; line-height: 1.55;
  }
  .fund-card ul li:last-child { border-bottom: none; }

  .mou-grid {
    display: grid; grid-template-columns: repeat(2,1fr);
    gap: 16px; margin-top: 16px;
  }
  .mou-grid img {
    width: 100%; border-radius: 10px;
    border: 1.5px solid #1d3a6e;
    object-fit: cover; aspect-ratio: 1;
  }
  .placeholder-box {
    aspect-ratio: 1; background: #152d56;
    border: 2px dashed #3ab06a; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    color: #3ab06a; font-size: .9rem;
  }
  /* === Motion upgrade === */
  :root{--ease:cubic-bezier(.22,1,.36,1)}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
  @keyframes modalIn{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
  @keyframes overlayIn{from{opacity:0}to{opacity:1}}
  .header h1,.header p{animation:fadeUp .9s var(--ease) both}
  .header p{animation-delay:.15s}
  .dash-card{transition:transform .5s var(--ease),box-shadow .5s var(--ease),border-color .4s;will-change:transform}
  .dash-card:hover{transform:translateY(-8px) scale(1.02);box-shadow:0 18px 46px rgba(94,201,137,.22);border-color:rgba(94,201,137,.8)}
  .dash-card:active{transform:translateY(-3px) scale(.99);transition-duration:.15s}
  .circle-btn{transition:transform .5s var(--ease),box-shadow .5s var(--ease)}
  .circle-btn:hover{transform:translateY(-6px) scale(1.05);box-shadow:0 16px 40px rgba(94,201,137,.35)}
  .overlay.active{animation:overlayIn .35s var(--ease)}
  .overlay.active .modal{animation:modalIn .5s var(--ease)}
  .tag{transition:transform .35s var(--ease),background .35s,box-shadow .35s}
  .tag:hover{transform:translateY(-3px);box-shadow:0 6px 18px rgba(94,201,137,.25)}
  .stat-card{transition:transform .45s var(--ease),box-shadow .45s var(--ease)}
  .stat-card:hover{transform:translateY(-5px);box-shadow:0 12px 30px rgba(0,0,0,.35)}
  .project-tab{transition:transform .3s var(--ease),background .3s,color .3s}
  .project-tab:hover{transform:translateY(-2px)}
  .modal-close,.img-viewer-close{transition:transform .3s var(--ease),background .3s}
  .modal-close:hover,.img-viewer-close:hover{transform:rotate(90deg) scale(1.1)}
  .modal img{transition:transform .5s var(--ease),box-shadow .5s var(--ease)}
  .modal img:hover{transform:scale(1.025);box-shadow:0 10px 34px rgba(0,0,0,.45)}
  .reveal{opacity:0;transform:translateY(26px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
  .reveal.in{opacity:1;transform:none}
</style>
</head>

  document.getElementById('viewer-img').src = viewerImages[viewerIndex];

    <h2>Institutional Leadership</h2>

    <div class="section-title">Academic Governance & Institutional Architecture</div>
    <p class="body-text">Dr. Nermine Mahmoud played a foundational role in shaping the academic governance and strategic direction of the Faculty of Social and Human Sciences. She served as a principal architect of the Faculty's accreditation process, securing formal approval from the Higher Committee of the Supreme Council of Universities and establishing the regulatory framework governing its academic operations.</p>
    <p class="body-text">She led the development of the academic bylaws and study plan for the Psychology Dual Degree Program in collaboration with Arizona State University (ASU), aligning the program with international academic standards. In parallel, she spearheaded the institutionalization of the Social Psychology Program, strengthening interdisciplinary integration and enhancing the Faculty's academic competitiveness.</p>

    <div class="tag-list">
      <span class="tag">Faculty Accreditation</span>
      <span class="tag">Supreme Council of Universities Approval</span>
      <span class="tag">Academic Bylaws Development</span>

    <div class="section-title">Digital Mental Health Transformation</div>
    <p class="body-text">As Founder and Executive Director of the Wellbeing Center, Dr. Nermine pioneered a model of Digital Mental Health Transformation within the University ecosystem. Under her leadership, the Center evolved into a structured platform delivering Tech-Enabled Psychological Services through the strategic integration of AI-driven solutions in the psychology field.</p>
    <p class="body-text">These innovations enhanced psychological assessment methodologies, strengthened early detection and intervention systems, broadened community access to evidence-based mental health services, and scaled the Center's reach across students, academic staff, and families.</p>

    <div class="tag-list">
      <span class="tag">Digital Mental Health Model</span>
      <span class="tag">Tech-Enabled Psychological Services</span>
      <span class="tag">AI-Driven Solutions</span>

      <span class="tag">Evidence-Based Support</span>
    </div>

    <div class="section-title">Sign Language — National & Regional Landmark</div>
    <p class="body-text">Under Dr. Nermine's executive leadership, Galala University became the <strong style="color:#7ecfa0;">first university in Egypt and across the Arab region</strong> to formally mandate and generalize the study of Sign Language across all faculties and disciplines. This landmark initiative represents a strategic commitment to inclusive education, embedding accessibility within the University's core academic framework.</p>

    <div class="section-title">FAHEM Foundation Alignment</div>
    <p class="body-text">Dr. Nermine's contributions align with national efforts to advance mental health awareness and psychosocial resilience, including the initiatives of FAHEM Foundation, founded by Her Excellency Ambassador Nabila Makram.</p>

function openModal(key) {
  document.getElementById('modal-body').innerHTML = MODALS[key];
  document.getElementById('overlay').classList.add('active');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  document.getElementById('overlay').classList.remove('active');
  document.body.style.overflow = '';
}
function closeOnBg(e) { if(e.target.id==='overlay') closeModal(); }
function switchTab(btn, tabId) {
  btn.closest('.modal').querySelectorAll('.project-tab').forEach(b=>b.classList.remove('active'));
  btn.closest('.modal').querySelectorAll('.project-panel').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(tabId).classList.add('active');
}
document.addEventListener('keydown', e => {
  if(e.key==='Escape') { closeModal(); closeViewer(); }

});

const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
document.querySelectorAll('.dash-card,.stat-card,.circle-btn').forEach((el,i)=>{el.classList.add('reveal');el.style.transitionDelay=(i%6*70)+'ms';io.observe(el)});
</script>
